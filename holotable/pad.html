<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Helios Datapad — Table Games</title>
  <link rel="stylesheet" href="css/holo.css" />
</head>
<body>
  <div class="pad-shell">
    <header class="holo-header">
      <h1>Datapad</h1>
      <span class="tag" id="player-tag">PRIVATE</span>
    </header>

    <div class="pad-turn waiting" id="pad-turn" aria-live="polite">Waiting…</div>

    <div class="game-picker panel" id="game-picker" role="radiogroup" aria-label="Select game">
      <h2>Game</h2>
      <div class="picker-row">
        <button type="button" class="pick active" data-game="flip7" id="pick-flip7"
                role="radio" aria-checked="true">
          Reactor Overload
          <span class="pick-sub">Flip 7</span>
        </button>
        <button type="button" class="pick" data-game="sabacc" id="pick-sabacc"
                role="radio" aria-checked="false">
          Sabacc
          <span class="pick-sub">Spike · 0</span>
        </button>
      </div>
    </div>

    <div class="bot-picker panel" id="bot-picker" role="group" aria-label="Computer opponents">
      <h2>Computers</h2>
      <div class="bot-row" id="bot-row">
        <button type="button" class="bot-n active" data-computers="0" aria-pressed="true">0</button>
        <button type="button" class="bot-n" data-computers="1" aria-pressed="false">1</button>
        <button type="button" class="bot-n" data-computers="2" aria-pressed="false">2</button>
        <button type="button" class="bot-n" data-computers="3" aria-pressed="false">3</button>
      </div>
      <p class="legend" style="margin:0.4rem 0 0">Solo: pick 1–3. Bots need no pad.</p>
    </div>

    <section class="panel" aria-label="Hand">
      <h2 id="hand-heading">Your hand</h2>
      <div class="hand" id="hand"></div>
      <p class="pad-sum-line" id="pad-sum" hidden></p>
    </section>

    <div class="actions">
      <button type="button" id="btn-hit">Hit · Draw</button>
      <button type="button" id="btn-stay">Stay · Bank</button>
      <button type="button" class="hazard" id="btn-new">New match</button>
    </div>

    <p class="pad-meta" id="pad-meta">Connecting…</p>
    <p class="conn" id="conn" style="text-align:center;margin-top:0.45rem">…</p>

    <div class="todo">
      <details>
        <summary>Help · seat &amp; table</summary>
        <p id="pad-todo">
          Containment Lock / Overcharge Pulse / Neutralizer Shield resolve in the
          Python <code>flip7</code> engine. Public table:
          <a href="index.html#REACTOR">Helios REACTOR</a>.
          Seat via <code>?seat=0</code>, <code>?seat=1</code>, …
        </p>
      </details>
    </div>
  </div>
  <script src="js/holo.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const seat = Number(params.get("seat") || "0");
      document.getElementById("player-tag").textContent = "PRIVATE · SEAT " + seat;

      let state = null;
      let client = null;
      let lastRules = "flip7";
      let lastComputers = 0;

      function cardEl(label, sabacc) {
        const div = document.createElement("div");
        const action = Holo.isActionLabel(label);
        let cls = "card";
        if (sabacc) {
          const pol = Holo.cardPolarity(label);
          if (pol) cls += " " + pol;
        } else if (action) {
          cls += " action";
        }
        div.className = cls;
        const short = Holo.cardShort(label);
        if (!sabacc && action) {
          div.innerHTML =
            '<span class="rank">' + short + "</span>" +
            '<span class="sub">' + String(label).split(" ")[0] + "</span>";
        } else if (sabacc) {
          div.innerHTML =
            '<span class="rank">' + short + '</span><span class="sub">spike</span>';
        } else {
          div.innerHTML =
            '<span class="rank">' + short + '</span><span class="sub">flux</span>';
        }
        return div;
      }

      function syncPicker(rules) {
        lastRules = rules === "sabacc" ? "sabacc" : "flip7";
        document.querySelectorAll(".pick").forEach(function (btn) {
          const on = btn.getAttribute("data-game") === lastRules;
          btn.classList.toggle("active", on);
          btn.setAttribute("aria-checked", on ? "true" : "false");
        });
      }

      function syncBots(n) {
        lastComputers = Number(n) || 0;
        document.querySelectorAll(".bot-n").forEach(function (btn) {
          const on = Number(btn.getAttribute("data-computers")) === lastComputers;
          btn.classList.toggle("active", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      function render(s) {
        state = s;
        const sabacc = Holo.isSabacc(s);
        syncPicker(sabacc ? "sabacc" : "flip7");
        if (s.computers !== undefined && s.computers !== null) syncBots(s.computers);

        document.getElementById("btn-hit").textContent = sabacc
          ? "Draw · Hit"
          : "Hit · Draw";
        document.getElementById("btn-stay").textContent = sabacc
          ? "Stand · Bank"
          : "Stay · Bank";
        document.getElementById("pad-todo").innerHTML = sabacc
          ? "Sabacc house rules (Spike toward 0). Bomb-out if |sum| &gt; 23. " +
            "Fan/home private table — not a licensed Lucasfilm product. " +
            'Public: <a href="index.html#REACTOR">Helios REACTOR</a>.'
          : "Containment Lock / Overcharge Pulse / Neutralizer Shield resolve in the " +
            "Python <code>flip7</code> engine. Public table: " +
            '<a href="index.html#REACTOR">Helios REACTOR</a>. ' +
            "Seat via <code>?seat=0</code>, <code>?seat=1</code>, …";

        const hand = document.getElementById("hand");
        hand.innerHTML = "";
        (s.hand || []).forEach(function (c) {
          hand.appendChild(cardEl(c, sabacc));
        });

        const sumEl = document.getElementById("pad-sum");
        if (sabacc) {
          sumEl.hidden = false;
          const hs = s.hand_sum || 0;
          sumEl.textContent =
            "Sum " + (hs > 0 ? "+" : "") + hs +
            " · stand " + (s.turn_score || 0) +
            " · to " + (s.target || 100);
        } else {
          sumEl.hidden = false;
          sumEl.textContent =
            "Turn charge " + (s.turn_score || 0) +
            (!sabacc && s.shield ? " · SHIELD" : "") +
            " · to " + (s.target || 200);
        }

        const can = s.can_act && s.active_seat === seat;
        document.getElementById("btn-hit").disabled = !can;
        document.getElementById("btn-stay").disabled = !can;

        const turn = document.getElementById("pad-turn");
        if (can) {
          turn.className = "pad-turn your-turn";
          turn.textContent = "Your turn · act now";
        } else if (s.active_seat === seat) {
          turn.className = "pad-turn waiting";
          turn.textContent = "Your seat · resolving…";
        } else {
          turn.className = "pad-turn waiting";
          const who = (s.players || []).find(function (p) { return p.seat === s.active_seat; });
          const label = who
            ? (who.is_bot ? who.name + " (CPU)" : who.name)
            : ("seat " + s.active_seat);
          turn.textContent = "Waiting · " + label;
        }

        const me = (s.players || []).find(function (p) { return p.seat === seat; });
        document.getElementById("pad-meta").textContent =
          (me ? me.name + " · " + me.score + " pts" : "Seat " + seat) +
          " · " + (s.title || (sabacc ? "Sabacc" : "Reactor Overload")) +
          (s.status ? " · " + s.status : "");
      }

      document.getElementById("btn-hit").addEventListener("click", function () {
        client && client.hit(seat).catch(function (e) {
          document.getElementById("pad-meta").textContent = String(e.message || e);
        });
      });
      document.getElementById("btn-stay").addEventListener("click", function () {
        client && client.stay(seat).catch(function (e) {
          document.getElementById("pad-meta").textContent = String(e.message || e);
        });
      });
      document.getElementById("btn-new").addEventListener("click", function () {
        client && client.newMatch(null, null, lastComputers).catch(function (e) {
          document.getElementById("pad-meta").textContent = String(e.message || e);
        });
      });
      document.getElementById("game-picker").addEventListener("click", function (e) {
        const btn = e.target.closest("button[data-game]");
        if (!btn || !client) return;
        const game = btn.getAttribute("data-game");
        if (game === lastRules) return;
        client.setGame(game, null, lastComputers).catch(function (err) {
          document.getElementById("pad-meta").textContent = String(err.message || err);
        });
      });
      document.getElementById("bot-picker").addEventListener("click", function (e) {
        const btn = e.target.closest("button[data-computers]");
        if (!btn || !client) return;
        const n = Number(btn.getAttribute("data-computers"));
        if (n === lastComputers) return;
        client.setComputers(n).catch(function (err) {
          document.getElementById("pad-meta").textContent = String(err.message || err);
        });
      });

      const conn = document.getElementById("conn");
      client = Holo.connect({
        role: "pad",
        seat: seat,
        onConn: function (ok) {
          conn.textContent = ok ? "link OK · ws" : "link… (REST poll)";
          conn.className = "conn " + (ok ? "ok" : "bad");
        },
        onState: render,
        onError: function (err) {
          document.getElementById("pad-meta").textContent = String(err);
        },
      });
    })();
  </script>
</body>
</html>
