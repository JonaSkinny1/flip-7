<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helios Datapad — Reactor Overload</title>
  <link rel="stylesheet" href="css/holo.css" />
</head>
<body>
  <div class="pad-shell">
    <header class="holo-header">
      <h1>Datapad</h1>
      <span class="tag" id="player-tag">PRIVATE</span>
    </header>

    <section class="panel" aria-label="Hand">
      <h2>Hand</h2>
      <div class="hand" id="hand"></div>
    </section>

    <div class="actions">
      <button type="button" id="btn-hit">Hit · Draw Core</button>
      <button type="button" id="btn-stay">Stay · Bank Charge</button>
      <button type="button" class="hazard" id="btn-new">New match</button>
    </div>

    <p class="pad-meta" id="pad-meta">Connecting…</p>
    <p class="conn" id="conn" style="text-align:center;margin-top:0.5rem">…</p>

    <p class="todo">
      Containment Lock / Overcharge Pulse / Neutralizer Shield resolve in the
      Python <code>flip7</code> engine. Public table:
      <a href="index.html#REACTOR">Helios REACTOR</a>.
      Seat via <code>?seat=0</code>, <code>?seat=1</code>, …
    </p>
  </div>
  <script src="js/holo.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const seat = Number(params.get("seat") || "0");
      document.getElementById("player-tag").textContent = "PRIVATE · SEAT " + seat;

      let state = null;
      let client = null;

      function cardEl(label) {
        const div = document.createElement("div");
        const action = Holo.isActionLabel(label);
        div.className = "card" + (action ? " action" : "");
        const short = Holo.cardShort(label);
        if (action) {
          div.innerHTML =
            '<span class="rank">' + short + "</span>" +
            '<span class="sub">' + String(label).split(" ")[0] + "</span>";
        } else {
          div.innerHTML =
            '<span class="rank">' + short + '</span><span class="sub">flux</span>';
        }
        return div;
      }

      function render(s) {
        state = s;
        const hand = document.getElementById("hand");
        hand.innerHTML = "";
        const mine = s.active_seat === seat;
        // Hand is current turn hand (visible on table too in Flip 7); show when our turn or always for awareness
        (s.hand || []).forEach(function (c) {
          hand.appendChild(cardEl(c));
        });

        const can = s.can_act && mine;
        document.getElementById("btn-hit").disabled = !can;
        document.getElementById("btn-stay").disabled = !can;

        const me = (s.players || []).find(function (p) { return p.seat === seat; });
        document.getElementById("pad-meta").textContent =
          (me ? me.name + " · score " + me.score : "Seat " + seat) +
          " · turn charge " + (s.turn_score || 0) +
          (s.shield ? " · SHIELD" : "") +
          " · active S" + s.active_seat +
          " · " + (s.status || "");
      }

      document.getElementById("btn-hit").addEventListener("click", function () {
        client && client.hit(seat).catch(function (e) {
          document.getElementById("pad-meta").textContent = String(e.message || e);
        });
      });
      document.getElementById("btn-stay").addEventListener("click", function () {
        client && client.stay(seat).catch(function (e) {
          document.getElementById("pad-meta").textContent = String(e.message || e);
        });
      });
      document.getElementById("btn-new").addEventListener("click", function () {
        client && client.newMatch().catch(function (e) {
          document.getElementById("pad-meta").textContent = String(e.message || e);
        });
      });

      const conn = document.getElementById("conn");
      client = Holo.connect({
        role: "pad",
        seat: seat,
        onConn: function (ok) {
          conn.textContent = ok ? "link OK · ws" : "link… (REST poll)";
          conn.className = "conn " + (ok ? "ok" : "bad");
        },
        onState: render,
        onError: function (err) {
          document.getElementById("pad-meta").textContent = String(err);
        },
      });
    })();
  </script>
</body>
</html>
